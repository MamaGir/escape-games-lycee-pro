<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le four verrouillé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: plan de manufacture en papier calque (cyanotype). Une bande de 8 cases-lettres en haut, 8 salles en grille dessous.
   Le feu du four (orange) est la seule couleur chaude : il ne sert qu'aux lettres, au four et aux alertes d'indices. */
:root{
  --bg:#EEF5FB; --panel:#FFFFFF; --ink:#0B2A4A; --mute:#4A6482; --line:#BCD3E8; --grid:rgba(15,76,129,.065);
  --blue:#0F4C81; --blue2:#2F75B5; --tint:#DCEEFF; --on-blue:#FFFFFF;
  --fire:#C2410C; --fire-bg:#FFE9DB;
  --ok:#17693F; --ok-bg:#E2F3E9; --bad:#B42318; --bad-bg:#FDE8E6; --warn-bg:#FFF4D6; --warn:#7A5600;
  --f-display:'Barlow Condensed','Arial Narrow',Calibri,sans-serif;
  --f-body:Calibri,Carlito,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08203A; --panel:#0E2F52; --ink:#E6F1FB; --mute:#9DB8D3; --line:#25507C; --grid:rgba(127,181,232,.09);
    --blue:#8CBCEB; --blue2:#5AA0E0; --tint:#14416C; --on-blue:#06213D;
    --fire:#FF9A55; --fire-bg:#3A2314;
    --ok:#6FD9A4; --ok-bg:#0F3A2C; --bad:#FF9A90; --bad-bg:#4A1F25; --warn-bg:#40330F; --warn:#F2CF72;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08203A; --panel:#0E2F52; --ink:#E6F1FB; --mute:#9DB8D3; --line:#25507C; --grid:rgba(127,181,232,.09);
  --blue:#8CBCEB; --blue2:#5AA0E0; --tint:#14416C; --on-blue:#06213D;
  --fire:#FF9A55; --fire-bg:#3A2314;
  --ok:#6FD9A4; --ok-bg:#0F3A2C; --bad:#FF9A90; --bad-bg:#4A1F25; --warn-bg:#40330F; --warn:#F2CF72;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.5; margin:0; min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:.9rem;color:var(--mute)}

/* Barre */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:2px solid var(--blue)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);background:none;border:0;padding:0;cursor:pointer;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.05em;border:1.5px solid var(--line);border-radius:4px;padding:2px 10px;background:var(--bg);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.late{border-color:var(--bad);color:var(--bad)}
.btn{background:var(--blue);color:var(--on-blue);border:2px solid var(--blue);border-radius:4px;padding:9px 18px;font-weight:700;cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.small{padding:4px 12px;font-size:.95rem}
.btn.fire{background:var(--fire);border-color:var(--fire);color:#fff}
:root[data-theme="dark"] .btn.fire{color:#2A1203}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.fire{color:#2A1203}}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{padding-block:22px 64px;display:block}

/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:10px 6px}
.hero h1{font-size:clamp(3rem,9vw,5.6rem);text-transform:uppercase;color:var(--blue);margin-block:6px 14px}
.hero h1 span{color:var(--fire)}
.story{max-width:56ch;font-size:1.1rem}
.kilnart{width:100%;max-width:340px;justify-self:center;color:var(--blue)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-block:22px 8px;padding:0;list-style:none}
.rules li{background:var(--panel);border:1.5px solid var(--line);padding:12px 14px;border-radius:4px}
.rules b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);display:block}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:16px}
.mode{display:block;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:14px 16px;cursor:pointer}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode:has(input:checked){border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--tint)}
.mode:has(input:focus-visible){outline:3px solid var(--blue2);outline-offset:2px}
.mode h3{font-size:1.5rem;text-transform:uppercase;color:var(--blue)}
.mode p{font-size:.97rem;color:var(--mute);margin-top:4px}
.mode:has(input:checked) p{color:var(--ink)}
.foot{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:.95rem}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer}

/* Bande de code */
.code{display:flex;gap:8px;flex-wrap:nowrap}
.slot{flex:1 1 0;min-width:0;aspect-ratio:3/4;max-width:92px;border:2px dashed var(--line);border-radius:4px;background:var(--panel);display:grid;place-items:center;position:relative;font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,6.5vw,3.4rem);color:var(--line);line-height:1}
.slot small{position:absolute;top:3px;left:5px;font-size:.7rem;font-weight:600;letter-spacing:.06em;color:var(--mute)}
.slot.on{border:2px solid var(--fire);border-style:solid;background:var(--fire-bg);color:var(--fire)}
.slot.pop b{animation:pop .6s ease-out}
.code.mini .slot{max-width:38px;font-size:1.25rem;aspect-ratio:1/1.15}
.code.mini .slot small{display:none}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.slot b{font-weight:700}

.doorform{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:16px}
.doorform label{display:block;font-weight:700;margin-bottom:4px}
.doorform input{width:min(280px,100%);padding:9px 12px;border:2px solid var(--blue);border-radius:4px;background:var(--panel);text-transform:uppercase;letter-spacing:.18em;font-family:var(--f-display);font-size:1.4rem;font-weight:600}
.doorform .fbk{flex-basis:100%;min-height:1.4em;margin:0}

/* Salles */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(222px,1fr));gap:14px;margin-top:26px}
.rc{display:flex;flex-direction:column;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:0;cursor:pointer;overflow:hidden}
.rc:hover{border-color:var(--blue)}
.rc .art{background:var(--tint);color:var(--blue);padding:8px 10px;border-bottom:2px solid var(--line)}
.rc .art svg{display:block;width:100%;height:78px}
.rc .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.rc h3{font-size:1.45rem;text-transform:uppercase;color:var(--blue)}
.rc .sub{color:var(--mute);font-size:.95rem}
.rc .st{margin-top:8px;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;color:var(--mute)}
.rc.done{border-color:var(--fire)}
.rc.done .st{color:var(--fire)}
.rc.todo .st::before{content:"○ "}
.rc.part .st::before{content:"◐ "}
.rc.done .st::before{content:"● "}
.sectitle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}
.sectitle h2{font-size:1.9rem;text-transform:uppercase;color:var(--blue)}

/* Salle */
.back{margin-bottom:14px}
.rhead{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;background:var(--panel);border:2px solid var(--blue);border-radius:4px;padding:14px 16px}
.rhead .art{color:var(--blue);background:var(--tint);padding:6px;border-radius:2px}
.rhead svg{display:block;width:100%;height:auto}
.rhead h2{font-size:clamp(2rem,6vw,3rem);text-transform:uppercase;color:var(--blue)}
.rhead p.h{margin-top:8px}
.rhead .code{margin-top:12px}
.ep{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:16px 18px;margin-top:16px}
.ep h3{font-size:1.5rem;text-transform:uppercase;color:var(--blue)}
.ep .consigne{margin-top:4px;color:var(--mute)}
.ep.is-done{border-color:var(--ok);background:var(--ok-bg)}
.ep-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.fb{margin:0;font-weight:700}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.fb.warn{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,.8fr);gap:8px 14px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg)}
.row.bad{border-color:var(--bad);background:var(--bad-bg)}
.row .t{min-width:0}
select{width:100%;padding:7px 8px;border:2px solid var(--blue2);border-radius:4px;background:var(--panel);min-height:40px}
select:disabled,input:disabled{opacity:.8}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:2px solid var(--blue2);background:var(--panel);color:var(--blue);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:.95rem;min-height:36px}
.pill[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pill:disabled{cursor:default}
.row.sort{grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.row.sort{grid-template-columns:minmax(0,1fr) auto}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:4px;background:var(--bg);cursor:pointer}
.opt input{margin-top:5px;width:18px;height:18px;accent-color:var(--blue)}
.opt.on{border-color:var(--blue);background:var(--tint)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.ord{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);border-radius:4px;background:var(--bg)}
.ord.bad{border-color:var(--bad);background:var(--bad-bg)}
.ord .n{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--blue);width:1.4em}
.ord .t{flex:1;min-width:0}
.ord button{border:2px solid var(--blue2);background:var(--panel);color:var(--blue);border-radius:4px;width:40px;height:40px;cursor:pointer;font-size:1rem}
.ord button:disabled{opacity:.35;cursor:default}
.ends{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.9rem;color:var(--mute);margin-top:10px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.ph{border:2px solid var(--line);border-radius:4px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.ph.bad{border-color:var(--bad);background:var(--bad-bg)}
.ph img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.ph .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.ph ul{margin:0;padding-left:18px;font-size:.97rem}
.recipes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.rec{border:2px solid var(--line);border-radius:4px;background:var(--bg);padding:10px 12px}
.rec h4{font-family:var(--f-display);font-size:1.3rem;text-transform:uppercase;color:var(--blue);margin:0 0 6px}
.rec table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rec td{padding:4px 0;border-bottom:1px dashed var(--line);vertical-align:middle}
.rec td.v{text-align:right;width:6.5em;font-weight:700}
.rec tr.tot td{border-bottom:0;color:var(--mute);font-size:.92rem;padding-top:6px}
.rec input{width:5.2em;padding:5px 6px;text-align:right;border:2px solid var(--blue2);border-radius:4px;background:var(--panel);font-weight:700}
.rec input.bad{border-color:var(--bad);background:var(--bad-bg)}
.hints{margin-top:20px;border:2px dashed var(--fire);border-radius:4px;padding:12px 16px;background:var(--panel)}
.hints h3{font-size:1.25rem;text-transform:uppercase;color:var(--fire)}
.hints ol{margin:8px 0 0;padding-left:22px}
.hints .btn{margin-top:10px}
.reveal{margin-top:18px;border:3px solid var(--fire);background:var(--fire-bg);border-radius:4px;padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.reveal .big{font-family:var(--f-display);font-weight:700;font-size:5rem;line-height:1;color:var(--fire);border:3px solid var(--fire);padding:4px 22px;border-radius:4px;animation:pop .7s ease-out}
.reveal h3{font-size:1.7rem;text-transform:uppercase;color:var(--fire)}

/* Fin */
.final{text-align:left}
.kiln{position:relative;width:min(340px,100%);aspect-ratio:1/.8;margin:12px 0 18px;border:3px solid var(--blue);border-radius:170px 170px 4px 4px;overflow:hidden;background:radial-gradient(circle at 50% 70%,#FFB347 0,var(--fire) 38%,#7A1F00 100%)}
.kiln i{position:absolute;top:0;bottom:0;width:50%;background:var(--blue);display:block;animation:open 1.6s .4s ease-in-out forwards}
.kiln i:first-child{left:0;border-right:2px solid var(--panel)}
.kiln i:last-child{right:0;border-left:2px solid var(--panel);animation-name:open2}
.kiln span{position:absolute;inset:auto 0 12px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.7rem;letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
@keyframes open{to{transform:translateX(-96%)}}
@keyframes open2{to{transform:translateX(96%)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-block:14px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:10px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--mute);font-size:.95rem}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:10px}

/* Carnet */
.drawer{position:fixed;inset:0;z-index:50;background:rgba(5,20,38,.55);display:flex;justify-content:flex-end}
.drawer .panel{width:min(560px,100%);height:100%;overflow:auto;background:var(--panel);border-left:3px solid var(--blue);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.drawer h2{font-size:2rem;text-transform:uppercase;color:var(--blue)}
.drawer h3{font-size:1.3rem;text-transform:uppercase;color:var(--blue);margin-top:18px}
.tbl{overflow-x:auto;margin-top:8px}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--tint);color:var(--blue)}
.mots dt{font-weight:700;color:var(--blue)}
.mots dd{margin:0 0 6px}

/* Enseignant */
.prof h2{font-size:2rem;text-transform:uppercase;color:var(--blue);margin-top:26px}
.prof h3{font-size:1.3rem;text-transform:uppercase;color:var(--blue);margin-top:16px}
.prof .card{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:14px 16px;margin-top:12px}
.prof ul,.prof ol{margin:6px 0;padding-left:22px}
.prof .answ{font-size:.97rem}
.gate{max-width:420px;background:var(--panel);border:2px solid var(--blue);border-radius:4px;padding:16px}
.gate input{width:100%;padding:8px 10px;border:2px solid var(--blue2);border-radius:4px;background:var(--bg);margin:8px 0}

@media (max-width:640px){
  .hero{grid-template-columns:1fr}
  .kilnart{max-width:220px;justify-self:start}
  .rhead{grid-template-columns:1fr}
  .rhead .art{max-width:170px}
  .row{grid-template-columns:1fr}
  .code{gap:5px}
  .reveal .big{font-size:4rem}
}
@media (prefers-reduced-motion:reduce){
  .slot.pop b,.reveal .big{animation:none}
  .kiln i{animation:none}.kiln i:first-child{transform:translateX(-96%)}.kiln i:last-child{transform:translateX(96%)}
}
@media print{
  body{background:#fff;color:#000}
  body::before,.bar,.noprint{display:none!important}
  .prof .card{break-inside:avoid;border-color:#999}
}
.ico{stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ico .f{stroke:var(--fire)}
.ico text{fill:var(--fire);stroke:none;font-family:var(--f-display);font-weight:700}
</style>
</head>
<body>

<header class="bar" id="bar" hidden>
  <div class="wrap">
    <button class="brand" data-act="plan" title="Retour au plan de la manufacture">Le four verrouillé</button>
    <span class="chip" id="chipMode"></span>
    <span class="chip" id="timer" aria-label="Temps">--:--</span>
    <span class="chip" id="chipHints">Indices 0</span>
    <button class="btn small ghost" id="btnCarnet" data-act="carnet" hidden>Carnet de cours</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<aside class="drawer" id="carnet" role="dialog" aria-modal="true" aria-label="Carnet de cours" hidden>
  <div class="panel" id="carnetPanel"></div>
</aside>

<script>
/* ==========================================================================

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

const S = { view:'start', mode:'decouverte', t0:0, tEnd:0, pen:0, hints:0, errors:0,
  cleared:{}, done:{}, ans:{}, fb:{}, hintN:{}, cur:null, profOk:false, lastPos:null };

const elapsed = () => ((S.tEnd||Date.now()) - S.t0)/1000 + S.pen;

function initAns(ep){
  switch(ep.type){
    case 'match': case 'photos': return ep.rows.map(()=> '');
    case 'qcm': return null;
    case 'multi': return [];
    case 'sort': return ep.items.map(()=> null);
    case 'order': return ep.start.slice();
    case 'calc': return {};
  }
}
function getAns(k,ep){ if(!(k in S.ans)) S.ans[k]=initAns(ep); return S.ans[k]; }
const num = v => { const n=parseFloat(String(v).replace(',','.').trim()); return isNaN(n)?null:n; };

function incomplete(ep,a){
  switch(ep.type){
    case 'match': case 'photos': return a.some(v=>v==='') ? 'Complète toutes les lignes avant de valider.' : '';
    case 'qcm': return a===null ? 'Choisis une réponse avant de valider.' : '';
    case 'multi': return a.length===0 ? 'Coche au moins une case avant de valider.' : '';
    case 'sort': return a.some(v=>v===null) ? 'Classe tous les éléments avant de valider.' : '';
    case 'calc': {
      let miss=false; ep.groups.forEach((g,gi)=>g.lines.forEach((l,li)=>{ if(l.v===undefined && num(a[gi+'.'+li]??'')===null) miss=true; }));
      return miss ? 'Remplis toutes les cases avant de valider.' : '';
    }
  }
  return '';
}
function check(ep,a){
  const w=[];
  switch(ep.type){
    case 'match': case 'photos': ep.rows.forEach((r,i)=>{ if(a[i]!==r.a) w.push(i); }); break;
    case 'qcm': if(a!==ep.a) w.push(a); break;
    case 'multi': ep.opts.forEach((o,i)=>{ if(a.includes(i)!==ep.a.includes(i)) w.push(i); }); break;
    case 'sort': ep.items.forEach((it,i)=>{ if(a[i]!==it.a) w.push(i); }); break;
    case 'order': a.forEach((idx,p)=>{ if(idx!==ep.sol[p]) w.push(p); }); break;
    case 'calc': ep.groups.forEach((g,gi)=>g.lines.forEach((l,li)=>{ if(l.v===undefined && Math.abs((num(a[gi+'.'+li])??-1)-l.a)>0.001) w.push(gi+'.'+li); })); break;
  }
  return w;
}

/* ---------- Rendu des épreuves ---------- */
function renderEp(r,i){
  const ep=r.eps[i], k=key(r,i), a=getAns(k,ep), done=!!S.done[k], fb=S.fb[k];
  const show = S.mode==='decouverte' && fb && fb.kind==='bad';
  const wrong = new Set(show ? fb.wrong : []);
  const dis = done ? 'disabled' : '';
  let body='';
  switch(ep.type){
    case 'match':
      body='<div class="list">'+ep.rows.map((row,j)=>`<div class="row ${wrong.has(j)?'bad':''}"><span class="t">${esc(row.q)}</span>
        <select ${dis} data-act="sel" data-k="${k}" data-i="${j}" aria-label="Réponse pour : ${esc(row.q)}"><option value="">Choisir…</option>${ep.opts.map(o=>`<option value="${esc(o)}" ${a[j]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`).join('')+'</div>';
      break;
    case 'photos':
      body='<div class="photos">'+ep.rows.map((row,j)=>`<div class="ph ${wrong.has(j)?'bad':''}"><img src="${IMG[row.img]}" alt="${esc(row.alt)}" loading="lazy"><div class="in"><ul>${row.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
        <select ${dis} data-act="sel" data-k="${k}" data-i="${j}" aria-label="Nom de l'argile de la photo ${j+1}"><option value="">Quelle argile ?</option>${ep.opts.map(o=>`<option value="${esc(o)}" ${a[j]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div></div>`).join('')+'</div>';
      break;
    case 'qcm':
      body='<div class="list" role="radiogroup">'+ep.opts.map((o,j)=>`<label class="opt ${a===j?'on':''} ${wrong.has(j)?'bad':''}"><input type="radio" name="q-${k}" ${a===j?'checked':''} ${dis} data-act="qcm" data-k="${k}" data-i="${j}"><span>${esc(o)}</span></label>`).join('')+'</div>';
      break;
    case 'multi':
      body='<div class="list">'+ep.opts.map((o,j)=>`<label class="opt ${a.includes(j)?'on':''} ${wrong.has(j)?'bad':''}"><input type="checkbox" ${a.includes(j)?'checked':''} ${dis} data-act="tog" data-k="${k}" data-i="${j}"><span>${esc(o)}</span></label>`).join('')+'</div>';
      break;
    case 'sort':
      body='<div class="list">'+ep.items.map((it,j)=>`<div class="row sort ${wrong.has(j)?'bad':''}"><span class="t">${esc(it.t)}</span><div class="pills" role="group" aria-label="Catégorie pour : ${esc(it.t)}">${ep.cats.map((c,ci)=>`<button type="button" class="pill" aria-pressed="${a[j]===ci}" ${dis} data-act="sort" data-k="${k}" data-i="${j}" data-v="${ci}">${esc(c)}</button>`).join('')}</div></div>`).join('')+'</div>';
      break;
    case 'order':
      body=`<div class="ends"><span>↑ ${esc(ep.haut)}</span></div><div class="list" style="margin-top:6px">`+a.map((idx,p)=>`<div class="ord ${wrong.has(p)?'bad':''}"><span class="n">${p+1}</span><span class="t">${esc(ep.items[idx])}</span>
        <button type="button" ${dis||p===0?'disabled':''} data-act="mv" data-k="${k}" data-i="${p}" data-v="-1" aria-label="Monter ${esc(ep.items[idx])}">▲</button>
        <button type="button" ${dis||p===a.length-1?'disabled':''} data-act="mv" data-k="${k}" data-i="${p}" data-v="1" aria-label="Descendre ${esc(ep.items[idx])}">▼</button></div>`).join('')+`</div><div class="ends"><span>↓ ${esc(ep.bas)}</span></div>`;
      break;
    case 'calc':
      body='<div class="recipes">'+ep.groups.map((g,gi)=>`<div class="rec"><h4>${esc(g.titre)}</h4><table>`+g.lines.map((l,li)=>{
        const id=gi+'.'+li;
        const cell = l.v!==undefined ? `${l.v} ${g.unit}` : `<input inputmode="decimal" autocomplete="off" ${dis} class="${wrong.has(id)?'bad':''}" data-act="num" data-k="${k}" data-id="${id}" value="${esc(a[id]??'')}" aria-label="${esc(g.titre+' : '+l.l)}"> ${g.unit}`;
        return `<tr><td>${esc(l.l)}</td><td class="v">${cell}</td></tr>`;
      }).join('')+(g.unit==='%'?'<tr class="tot"><td>Total</td><td class="v">100 %</td></tr>':'')+'</table></div>').join('')+'</div>';
      break;
  }
  const msg = done ? '<p class="fb ok" role="status">✓ Épreuve réussie</p>' : fb ? `<p class="fb ${fb.kind}" role="status">${esc(fb.msg)}</p>` : '';
  return `<section class="ep ${done?'is-done':''}" id="ep-${k.replace('.','-')}" aria-labelledby="t-${k.replace('.','-')}">
    <h3 id="t-${k.replace('.','-')}">${esc(ep.titre)}</h3><p class="consigne">${esc(ep.consigne)}</p>${body}
    <div class="ep-foot">${done?'':`<button class="btn" data-act="check" data-k="${k}">Valider</button>`}${msg}</div></section>`;
}
function swapEp(r,i){ const el=$('#ep-'+key(r,i).replace('.','-')); if(el) el.outerHTML=renderEp(r,i); }

function renderHints(r){
  const n=S.hintN[r.id]||0;
  const list = n ? `<ol>${r.indices.slice(0,n).map(h=>`<li>${esc(h)}</li>`).join('')}</ol>` : '<p>Bloqués ? Chaque indice vous rapproche de la page du chapitre à relire.</p>';

}

function codeStrip(mini){

    return `<div class="slot ${on?'on':''} ${pop?'pop':''}"><small>${i+1}</small><b>${on?l:'?'}</b></div>`;
  }).join('')+'</div>';
}

    case 'sort': return '<ul>'+ep.cats.map((c,ci)=>`<li><b>${esc(c)}</b> : ${ep.items.filter(it=>it.a===ci).map(it=>esc(it.t)).join(' ; ')||'—'}</li>`).join('')+'</ul>';

  return '';
}

  return `<div class="prof"><button class="btn ghost small back noprint" data-act="home">← Accueil</button>

    <h1 style="font-size:clamp(2.4rem,7vw,3.6rem);text-transform:uppercase;color:var(--blue)">Le four verrouillé : fiche et corrigé</h1>
    <div class="card"><h3 style="margin-top:0">Mise en œuvre</h3><ul>
      <li><b>Durée :</b> 40 à 55 minutes, dont 5 minutes de lancement et 10 minutes de débrief.</li>
      <li><b>Équipes :</b> 3 ou 4 élèves par appareil. Les 8 salles s'explorent dans n'importe quel ordre : on peut se répartir les salles puis mettre en commun les lettres.</li>
      <li><b>Mot-code :</b> <b>${esc(GAME.motCode)}</b>. Les positions des lettres ne suivent pas l'ordre des salles, pour que les élèves puissent deviner le mot avant d'avoir tout résolu.</li>
      <li><b>Mode Découverte :</b> carnet de cours ouvert dans le jeu, erreurs surlignées. Conseillé pour une première approche du chapitre.</li>
      <li><b>Mode Défi :</b> carnet fermé, ${GAME.dureeDefi} minutes, seul le nombre d'erreurs est donné, +1 minute par indice. Conseillé en révision.</li>
      <li><b>Matériel :</b> un appareil par équipe. Le chapitre imprimé reste utilisable en Défi si vous l'autorisez.</li></ul></div>
    <h2>Objectifs et salles</h2>
    <div class="tbl"><table class="t"><tr><th>Salle</th><th>Objectif de la séance travaillé</th><th>Où relire dans le chapitre</th></tr>
    ${GAME.salles.map((r,i)=>`<tr><td>${i+1}. ${esc(r.nom)}</td><td>${esc(r.objectif)}</td><td>${esc(r.cours)}</td></tr>`).join('')}</table></div>
    <h2>Corrigé par salle</h2>
    ${GAME.salles.map((r,i)=>`<div class="card answ"><h3 style="margin-top:0">${i+1}. ${esc(r.nom)} · lettre n° ${r.pos} : ${MOT[r.pos-1]}</h3>
      ${r.eps.map(ep=>`<p style="margin-top:8px"><b>${esc(ep.titre)}</b></p>${describe(ep)}`).join('')}
      <p style="margin-top:8px;color:var(--mute)"><b>Indices :</b> 1) ${esc(r.indices[0])} 2) ${esc(r.indices[1])}</p></div>`).join('')}
    <h2>Questions pour le débrief</h2><ol>${GAME.debrief.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>
    <p class="noprint" style="margin-top:20px;color:var(--mute)">Pour imprimer cette page, enregistrez le fichier HTML sur votre ordinateur, ouvrez-le dans un navigateur et utilisez l'impression du navigateur.</p></div>`;
}

/* ---------- Carnet ---------- */
const CARNET = `<div style="display:flex;justify-content:space-between;align-items:start;gap:10px"><h2>Carnet de cours</h2><button class="btn small ghost" data-act="closecarnet" id="closeCarnet">Fermer</button></div>
<p style="color:var(--mute)">Synthèse du chapitre « Les pâtes céramiques ».</p>
<h3>Mots à connaître</h3><dl class="mots">
<dt>Plastique</dt><dd>Se modèle facilement sans se casser.</dd><dt>Pâte grasse</dt><dd>Très plastique et collante.</dd>
<dt>Dégraissant</dt><dd>Matière ajoutée pour rendre la pâte moins collante.</dd><dt>Chamotte</dt><dd>Argile déjà cuite, puis broyée.</dd>
<dt>Émail</dt><dd>Poudre de verre mélangée à de l'eau ; après cuisson, couche brillante comme du verre.</dd><dt>Vitrifié</dt><dd>Devenu dur et étanche, comme du verre.</dd></dl>
<h3>Les notions</h3><div class="tbl"><table class="t"><tr><th>Notion</th><th>À retenir</th></tr>
<tr><td>Pâte céramique</td><td>Argile + autres matières (dégraissants…) dosées avec précision.</td></tr>
<tr><td>Minéraux argileux</td><td>Kaolinite (plasticité faible), illite (moyenne), smectite (haute).</td></tr>
<tr><td>Argile primaire</td><td>Reste sur place. Exemple : le kaolin.</td></tr>
<tr><td>Argile secondaire</td><td>Transportée par l'eau ou le vent, plus plastique.</td></tr>
<tr><td>Dégraissant</td><td>Rend la pâte moins collante : chamotte, sable, quartz, paille…</td></tr>
<tr><td>Température de cuisson</td><td>Plus elle est élevée, plus la pâte est dure et étanche.</td></tr></table></div>
<h3>Les argiles</h3><div class="tbl"><table class="t"><tr><th>Argile</th><th>Couleur</th><th>À retenir</th></tr>
<tr><td>Kaolin</td><td>Blanche</td><td>Primaire. Pour la porcelaine.</td></tr>
<tr><td>Ball clay</td><td>Blanc crème à gris clair</td><td>Secondaire, très plastique.</td></tr>
<tr><td>Terre à feu</td><td>Beige à brun clair</td><td>Secondaire, résiste à 1500 °C.</td></tr>
<tr><td>Terre à grès</td><td>Beige à brun</td><td>Secondaire, résiste au gel.</td></tr>
<tr><td>Argiles communes</td><td>Rouge</td><td>Secondaire, riche en fer.</td></tr>
<tr><td>Bentonite</td><td>—</td><td>Extrêmement plastique : on en ajoute un peu aux pâtes.</td></tr></table></div>
<h3>Les dégraissants</h3><div class="tbl"><table class="t"><tr><th>Type</th><th>Rôle</th><th>Exemples</th></tr>
<tr><td>Simples</td><td>Moins collante, reste solide</td><td>Chamotte, tessons broyés</td></tr>
<tr><td>Siliceux</td><td>Résistent à la chaleur, renforcent</td><td>Sable, quartz, galets broyés</td></tr>
<tr><td>Combustibles</td><td>Brûlent : petits trous, pièce légère</td><td>Paille, papier, sciure</td></tr>
<tr><td>Fondants</td><td>Aident à fondre : dur et vitrifié</td><td>Feldspath</td></tr></table></div>
<h3>Les familles de pâtes</h3><div class="tbl"><table class="t"><tr><th>Famille</th><th>À retenir</th><th>Cuisson</th></tr>
<tr><td>Terre cuite</td><td>Argile rouge riche en fer, souvent sans émail</td><td>1000 °C</td></tr>
<tr><td>Faïence</td><td>Argile commune ou blanche, émaillée</td><td>1050 °C</td></tr>
<tr><td>Raku</td><td>Beaucoup de chamotte : supporte les chocs de chaleur</td><td>1000 °C</td></tr>
<tr><td>Grès</td><td>Vitrifiée, dure et étanche</td><td>1280 °C</td></tr>
<tr><td>Vitreous</td><td>Blanche vitrifiée, émaillée, non translucide</td><td>1280 °C</td></tr>
<tr><td>Porcelaine</td><td>Blanche, kaolin, translucide si fine</td><td>1280 à 1400 °C</td></tr></table></div>
<h3>Recettes (en %)</h3><div class="tbl"><table class="t"><tr><th>Porcelaine</th><th>Grès</th><th>Raku</th></tr>
<tr><td>Kaolin 25 · Ball clay 25 · Feldspath 25 · Silice 25</td><td>Terre à feu 50 · Kaolin 30 · Feldspath 10 · Quartz 5 · Chamotte 5</td><td>Terre à feu 55 · Ball clay 25 · Chamotte 20</td></tr></table></div>
<p style="margin-top:12px"><b>⚠ Sécurité :</b> certaines matières fondantes contiennent du plomb, toxique. Gants, masque, lavage des mains.</p>`;

/* ---------- Navigation / rendu ---------- */
const app = $('#app');
function setHeader(){
  $('#bar').hidden = !S.started;
  $('#chipMode').textContent = S.mode==='defi' ? 'Mode Défi' : 'Mode Découverte';
  $('#chipHints').textContent = 'Indices '+S.hints;
  $('#btnCarnet').hidden = S.mode!=='decouverte';
  tick();
}
function show(view,rid){
  S.view=view; S.cur=rid||null;
  let h='';
  if(view==='start') h=viewStart();
  else if(view==='plan') h=viewPlan();
  else if(view==='room') h=viewRoom(room(rid));
  else if(view==='final') h=viewFinal();
  else if(view==='prof') h=viewProf();
  app.innerHTML=h;
  setHeader();
  window.scrollTo(0,0);
}
function tick(){
  if(!S.started){ return; }
  const el=$('#timer'); if(!el) return;
  const t=elapsed();
  if(S.mode==='defi'){ const rem=GAME.dureeDefi*60 - t; el.textContent='⏱ '+fmt(rem); el.classList.toggle('late',rem<0); }
  else { el.textContent='⏱ '+fmt(t); el.classList.remove('late'); }
}
setInterval(()=>{ if(S.started && !S.ended) tick(); },1000);

function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z]/g,'').toUpperCase(); }

function validate(k){
  const [rid,i]=k.split('.'); const r=room(rid), ep=r.eps[+i], a=getAns(k,ep);
  const miss=incomplete(ep,a);
  if(miss){ S.fb[k]={kind:'warn',msg:miss,wrong:[]}; }
  else{
    const w=check(ep,a);
    if(!w.length){ S.done[k]=true; delete S.fb[k]; }
    else{ S.errors++; S.fb[k]={kind:'bad',msg:w.length===1?'Une réponse est fausse. Relisez et corrigez.':`${w.length} réponses sont fausses. Relisez et corrigez.`,wrong:w}; }
  }
  swapEp(r,+i);
  if(S.done[k] && r.eps.every((_,j)=>S.done[key(r,j)]) && !S.cleared[r.id]){
    S.cleared[r.id]=true; S.lastPos=r.pos;
    $('#reveal').innerHTML=renderReveal(r);
    document.querySelectorAll('.rhead .code').forEach(c=>c.outerHTML=codeStrip(true));
    $('#reveal').scrollIntoView({behavior:'smooth',block:'center'});
  }
}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act, k=t.dataset.k;
  switch(act){
    case 'start': S.started=true; S.t0=Date.now(); S.pen=0; show('plan'); break;
    case 'plan': if(S.started) show('plan'); else show('start'); break;
    case 'home': show('start'); break;
    case 'room': show('room',t.dataset.r); break;
    case 'check': validate(k); break;
    case 'hint': { const r=room(t.dataset.r); S.hintN[r.id]=(S.hintN[r.id]||0)+1; S.hints++; if(S.mode==='defi') S.pen+=GAME.penaliteIndice; $('#hints').innerHTML=renderHints(r); setHeader(); break; }
    case 'sort': { const [rid]=k.split('.'); const r=room(rid), ep=r.eps[+k.split('.')[1]], a=getAns(k,ep); const j=+t.dataset.i; a[j]=+t.dataset.v; delete S.fb[k]; swapEp(r,+k.split('.')[1]); break; }
    case 'mv': { const [rid,ii]=k.split('.'); const r=room(rid), ep=r.eps[+ii], a=getAns(k,ep); const p=+t.dataset.i, d=+t.dataset.v; [a[p],a[p+d]]=[a[p+d],a[p]]; delete S.fb[k]; swapEp(r,+ii); break; }
    case 'carnet': $('#carnetPanel').innerHTML=CARNET; $('#carnet').hidden=false; $('#closeCarnet').focus(); break;
    case 'closecarnet': $('#carnet').hidden=true; break;
    case 'prof': show('prof'); break;
    case 'replay': location.reload(); break;
  }
});
document.addEventListener('click',e=>{ if(e.target.id==='carnet') $('#carnet').hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#carnet').hidden=true; });

document.addEventListener('change',e=>{
  const t=e.target; const act=t.dataset&&t.dataset.act; if(!act) return;
  if(act==='mode'){ S.mode=t.value; return; }
  const k=t.dataset.k; if(!k) return;
  const [rid,ii]=k.split('.'); const r=room(rid), ep=r.eps[+ii], a=getAns(k,ep);
  if(act==='sel'){ a[+t.dataset.i]=t.value; delete S.fb[k]; swapEp(r,+ii); }
  if(act==='qcm'){ S.ans[k]=+t.dataset.i; delete S.fb[k]; swapEp(r,+ii); }
  if(act==='tog'){ const j=+t.dataset.i; const x=a.indexOf(j); if(x>=0) a.splice(x,1); else a.push(j); delete S.fb[k]; swapEp(r,+ii); }
});
document.addEventListener('input',e=>{
  const t=e.target; if(t.dataset&&t.dataset.act==='num'){ const k=t.dataset.k; const [rid,ii]=k.split('.'); const r=room(rid), ep=r.eps[+ii]; getAns(k,ep)[t.dataset.id]=t.value; }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='doorForm'){
    const v=norm($('#mot').value), msg=$('#doorMsg');
    if(v===GAME.motCode){ S.ended=true; S.tEnd=Date.now(); show('final'); }
    else{ S.errors++; msg.className='fbk fb bad'; msg.textContent = v ? 'Ce n’est pas le bon mot. Le four reste fermé.' : 'Tapez le mot-code avant de valider.'; }
  }
  if(e.target.id==='gateForm'){
    if($('#gate').value.trim()===GAME.codeProf){ S.profOk=true; show('prof'); }
    else $('#gateMsg').textContent='Code incorrect.';
  }
});

show('start');
</script>
</body>
</html>
